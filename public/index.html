<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>senninproxy</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <h1>senninproxy</h1>

        <form id="proxy-form">
            <div class="input-group">
                <input
                    id="url"
                    type="text"
                    placeholder="URLを入力..."
                    autocomplete="off"
                    spellcheck="false"
                    required
                >
                <button id="go-button" type="submit">開く</button>
            </div>
        </form>

        <div id="error" class="error" hidden></div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
